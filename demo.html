<title>SMPL-X Diagnostic Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style id="app-style">

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2330;
    --border: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --warn: #f0883e;
    --danger: #f85149;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: #0d1117; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: .04em;
  }
  .logo span { color: var(--text-muted); }
  .badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(88,166,255,.12);
    color: var(--accent);
    border: 1px solid rgba(88,166,255,.3);
  }

  /* ── Layout ── */
  main { max-width: 1200px; margin: 0 auto; padding: 32px; }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Subject Tabs ── */
  .tab-row {
    display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .tab {
    font-family: var(--mono); font-size: 12px;
    padding: 6px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); transition: all .15s;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: rgba(88,166,255,.12); border-color: var(--accent); color: var(--accent); }

  /* ── Metric Cards ── */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  }
  .card.ok::before { background: var(--accent2); }
  .card.warn::before { background: var(--warn); }
  .card.danger::before { background: var(--danger); }
  .card-label { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .card-predicted { font-size: 28px; font-weight: 600; font-family: var(--mono); }
  .card-gt { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .card-error { font-family: var(--mono); font-size: 12px; margin-top: 8px; }
  .ok .card-error { color: var(--accent2); }
  .warn .card-error { color: var(--warn); }
  .danger .card-error { color: var(--danger); }
  .error-bar-bg { height: 4px; background: var(--border); border-radius: 2px; margin-top: 10px; }
  .error-bar { height: 4px; border-radius: 2px; transition: width .6s ease; }
  .ok .error-bar { background: var(--accent2); }
  .warn .error-bar { background: var(--warn); }
  .danger .error-bar { background: var(--danger); }

  /* ── Chart Area ── */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
  .chart-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 24px;
  }
  .chart-title { font-size: 13px; font-weight: 500; margin-bottom: 20px; color: var(--text-muted); }
  .chart-title strong { color: var(--text); }
  canvas { width: 100% !important; }

  /* ── LLM Diagnosis ── */
  .diagnosis-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 24px; margin-bottom: 32px;
  }
  .diagnosis-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  .llm-chip {
    font-family: var(--mono); font-size: 11px; padding: 3px 10px;
    border-radius: 12px; background: rgba(63,185,80,.12);
    color: var(--accent2); border: 1px solid rgba(63,185,80,.3);
  }
  .typing-area {
    font-family: var(--mono); font-size: 13px; line-height: 1.8;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 20px;
    min-height: 120px; position: relative;
  }
  .typing-area .cursor {
    display: inline-block; width: 8px; height: 14px;
    background: var(--accent2); vertical-align: middle;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .diag-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .diag-tag {
    font-family: var(--mono); font-size: 11px; padding: 3px 10px;
    border-radius: 4px; background: var(--surface2); color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .diag-tag.active { background: rgba(240,136,62,.1); color: var(--warn); border-color: rgba(240,136,62,.3); }

  /* ── Subject Info ── */
  .info-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
  .info-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px;
  }
  .info-box h3 { font-size: 13px; font-weight: 500; margin-bottom: 14px; color: var(--text-muted); }
  .kv { display: flex; justify-content: space-between; align-items: center;
        padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .kv:last-child { border: none; }
  .kv .k { color: var(--text-muted); font-family: var(--mono); font-size: 12px; }
  .kv .v { font-weight: 500; }
  .v.ok { color: var(--accent2); }
  .v.danger { color: var(--danger); }

  /* ── Pipeline Viz ── */
  .pipeline { display: flex; align-items: center; gap: 0; margin-bottom: 32px; overflow-x: auto; padding-bottom: 8px; }
  .pipe-step {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 18px; min-width: 130px; text-align: center;
    flex-shrink: 0;
  }
  .pipe-step .icon { font-size: 22px; margin-bottom: 6px; }
  .pipe-step .label { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .pipe-step.done { border-color: var(--accent2); }
  .pipe-step.done .label { color: var(--accent2); }
  .pipe-step.active { border-color: var(--accent); }
  .pipe-step.active .label { color: var(--accent); }
  .pipe-arrow { color: var(--border); font-size: 20px; padding: 0 6px; flex-shrink: 0; }

  /* ── Controls ── */
  .controls { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--mono); font-size: 12px; padding: 8px 20px;
    border-radius: 6px; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { opacity: .85; }

  select {
    font-family: var(--mono); font-size: 12px; padding: 8px 14px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
  }

  .threshold-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); }
  input[type=range] { accent-color: var(--accent); }

  footer { border-top: 1px solid var(--border); padding: 20px 32px; text-align: center;
           font-family: var(--mono); font-size: 11px; color: var(--text-muted); }

  .overview { display:grid; grid-template-columns: repeat(5, 1fr); gap:16px; margin-bottom:32px; }
  .ov { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px 20px; }
  .ov .n { font-family:var(--mono); font-size:24px; font-weight:600; }
  .ov .l { font-size:12px; color:var(--text-muted); }
  .ov.ok .n { color:var(--accent2); } .ov.warn .n { color:var(--warn); }
  .pipe-step.todo { border-style: dashed; opacity:.6; }
  .src-note { font-size:12px; color:var(--text-muted); margin-top:10px; }
  .typing-area { white-space: pre-wrap; }
  @media (max-width: 900px) { .cards, .overview { grid-template-columns: 1fr 1fr; } .chart-grid, .info-row { grid-template-columns: 1fr; } main { padding:16px; } }

  /* ── Editor ── */
  .editor { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); z-index: 200;
    background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 22px calc(20px + env(safe-area-inset-bottom, 0px));
    box-shadow: -12px 0 40px rgba(0,0,0,.45); }
  .editor[hidden] { display: none; }
  .editor h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .editor h4 { font-size: 13px; font-weight: 600; margin: 22px 0 10px; color: var(--accent); }
  .editor .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .ed-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .ed-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .ed-field span, .ed-grid span { font-size: 12px; color: var(--text-muted); }
  .editor input[type=text], .editor input[type=number], .editor textarea, .editor select {
    font-family: var(--sans); font-size: 13px; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 100%; }
  .editor textarea { min-height: 64px; resize: vertical; line-height: 1.5; }
  .editor input.bad { border-color: var(--danger); }
  .editor input:focus-visible, .editor textarea:focus-visible, .editor select:focus-visible, .btn:focus-visible, .tab:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; }
  .ed-grid { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 6px 8px; align-items: center; }
  .ed-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--surface2); }
  .ed-pipe { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .ed-pipe input[type=text] { flex: 1; }
  .ed-actions { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); background: var(--surface);
    padding: 14px 0 6px; margin-top: 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ed-status { font-size: 12px; color: var(--text-muted); width: 100%; }
  .ed-status.danger { color: var(--danger); } .ed-status.ok { color: var(--accent2); }
  .btn.small { padding: 5px 12px; font-size: 11px; }
  .btn.danger { border-color: rgba(248,81,73,.5); color: var(--danger); }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 32px; }
  .cmp-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  .cmp-table th { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--text-muted); text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .cmp-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12px; }
  .cmp-table tr:last-child td { border-bottom: none; }
  .cmp-table td:first-child { font-family: var(--sans); font-size: 13px; color: var(--text); }
  .cmp-note { font-size: 12px; color: var(--text-muted); padding: 0 16px 14px; }
  .preview-banner { background: rgba(240,136,62,.12); border: 1px solid rgba(240,136,62,.35); color: var(--warn);
    font-size: 12px; padding: 8px 14px; border-radius: 6px; margin-bottom: 20px; }
  .preview-banner[hidden] { display: none; }
</style>

const CATS = ['CLOTHING_VOLUME','DEPTH_AMBIGUITY','MODEL_MISMATCH','POSE_OR_KEYPOINT','SCALE_OR_RESOLUTION','LANDMARK_DEFINITION','FITTING_FAILURE','GT_SUSPECT','UNDETERMINED'];

let currentSubject = 0, threshold = 10;
let barChartInst, errorChartInst, crossChartInst, diagTimer = null;

// ── Helpers ──
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valid = x => x && Number.isFinite(x.pred) && Number.isFinite(x.gt) && x.gt > 0;
const signed = (p,g) => (p-g)/g*100;
const relErr = (p,g) => Math.abs(signed(p,g));
const errClass = r => r <= threshold ? 'ok' : r <= 20 ? 'warn' : 'danger';
const errLabel = r => r <= threshold ? `✓ Within ${threshold}%` : r <= 20 ? '⚠ Above threshold' : '✗ High error';
const colorFor = r => r <= threshold ? 'rgba(63,185,80,0.8)' : r <= 20 ? 'rgba(240,136,62,0.8)' : 'rgba(248,81,73,0.8)';
const fmt = x => (x>0?'+':'') + x.toFixed(1);
const subjects = () => VIEW.subjects;

const defOpts = () => ({ responsive:true, animation:{duration:300},
  plugins:{ legend:{ labels:{ color:'#8b949e', font:{family:'IBM Plex Mono',size:11}, filter: i => i.text !== '' } } },
  scales:{ x:{ticks:{color:'#8b949e',font:{family:'IBM Plex Mono',size:11}}, grid:{color:'#21262d'}},
           y:{ticks:{color:'#8b949e',font:{family:'IBM Plex Mono',size:11}}, grid:{color:'#21262d'}} } });
const threshLines = n => [
  { type:'line', label:`±${threshold}% threshold`, data:Array(n).fill(threshold), borderColor:'rgba(230,237,243,0.35)', borderDash:[4,4], borderWidth:1, pointRadius:0 },
  { type:'line', label:'', data:Array(n).fill(-threshold), borderColor:'rgba(230,237,243,0.35)', borderDash:[4,4], borderWidth:1, pointRadius:0 } ];

function renderOverview() {
  const n = subjects().length;
  document.getElementById('nBadge').textContent = `${n} subject${n===1?'':'s'} · real data`;
  document.getElementById('overviewLabel').textContent = `All Subjects — Mean Absolute Error (n = ${n})`;
  let within = 0, total = 0;
  const cards = KEYS.map(k => {
    const xs = subjects().map(s => s.m[k]).filter(valid);
    xs.forEach(x => { total++; if (relErr(x.pred, x.gt) <= 10) within++; });
    if (!xs.length) return `<div class="ov"><div class="n">—</div><div class="l">${SHORT[k]}</div></div>`;
    const mean = xs.reduce((a,x) => a + relErr(x.pred,x.gt), 0) / xs.length;
    const mae = xs.reduce((a,x) => a + Math.abs(x.pred-x.gt), 0) / xs.length;
    return `<div class="ov ${mean <= 10 ? 'ok':'warn'}"><div class="n">${mean.toFixed(1)}%</div><div class="l">${SHORT[k]} · MAE ${mae.toFixed(1)} cm</div></div>`;
  });
  cards.push(`<div class="ov ok"><div class="n">${within}/${total}</div><div class="l">measurements within 10%</div></div>`);
  document.getElementById('overview').innerHTML = cards.join('');
}

    const wr = relErr(s.m[worst].pred, s.m[worst].gt);

  }
  document.getElementById('errorSummary').innerHTML = `<h3>Error Summary</h3>${rows}${extra}`;
}

function renderCharts(s) {
  if (typeof Chart === 'undefined') return;

  if (s) {
    const val = k => valid(s.m[k]) ? s.m[k] : null;

    errorChartInst = new Chart(document.getElementById('errorChart'), { type:'bar',
      data:{ labels, datasets:[
        { label:'Signed error (%)', data:errs, backgroundColor:errs.map(e => colorFor(Math.abs(e ?? 0))), borderRadius:4 },

  }
  const palette = ['rgba(88,166,255,0.8)','rgba(63,185,80,0.8)','rgba(240,136,62,0.8)','rgba(188,140,255,0.8)'];

      ...KEYS.map((k,i) => ({ label:SHORT[k], data:subjects().map(x => valid(x.m[k]) ? +signed(x.m[k].pred, x.m[k].gt).toFixed(1) : null), backgroundColor:palette[i], borderRadius:3 })),

function renderTags(active) {
  document.getElementById('diagTags').innerHTML = CATS.map(c => `<span class="diag-tag ${active.includes(c)?'active':''}">${c}</span>`).join('');
}
function resetDiagnosis() {
  clearTimeout(diagTimer); diagTimer = null;
  document.getElementById('diagnosisText').innerHTML = '<span style="color:var(--text-muted)">Click Show Diagnosis to see GLM\'s explanation for this subject...</span>';
  renderTags([]);
}
function diagnosisText(s) {
  const circ = ['①','②','③','④','⑤','⑥','⑦','⑧'];
  let t = `OVERALL\n   ${s.summary || '(no summary yet)'}\n`;
  (s.diag || []).forEach((d,i) => {
    const x = s.m[d.k];
    const head = valid(x) ? ` — ${Math.abs(x.pred-x.gt).toFixed(1)} cm ${x.pred>x.gt?'too large':'too small'} (${fmt(signed(x.pred,x.gt))}%)` : '';
    t += `\n${circ[i] || (i+1)+'.'} ${SHORT[d.k].toUpperCase()}${head}\n`;
    t += `   ${d.exp}\n   Fix: ${d.fix}\n   Cause: ${d.cat} (confidence ${d.conf})${d.runsImage ? ` · same answer in ${d.runsImage} runs` : ''}\n`;
    const under = valid(x) && x.pred < x.gt;
    const alt = (name, c, r) => !c ? '' : c === 'INCONSISTENT' ? `${name}: no consistent answer` :
      `${name}: ${c}${r ? ` (${r})` : ''}${c === d.cat ? ' ✓' : ''}${c === 'CLOTHING_VOLUME' && under ? ' ⚠ breaks sign rule' : ''}`;
    const others = [alt('GLM', d.textOnly, d.runsText), alt('DeepSeek', d.ds, d.runsDS)].filter(Boolean);
    if (others.length) t += `   Without photo → ${others.join(' · ')}\n`;
  });
  const ok = KEYS.filter(k => valid(s.m[k]) && relErr(s.m[k].pred, s.m[k].gt) <= DIAG_TOL);
  if (ok.length) t += `\n✓ ${ok.map(k => SHORT[k]).join(', ')} — within ${DIAG_TOL}% of the tape measure (set by rule, not by the model)`;
  return t;
}
function runDiagnosis() {
  const s = subjects()[currentSubject]; if (!s) return;
  resetDiagnosis();
  const box = document.getElementById('diagnosisText'); box.innerHTML = '';
  const fullText = diagnosisText(s);
  renderTags((s.diag || []).map(d => d.cat));
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { box.textContent = fullText; return; }
  const cursor = document.createElement('span'); cursor.className = 'cursor'; box.appendChild(cursor);
  let i = 0;
  (function type() {
    if (i < fullText.length) { box.insertBefore(document.createTextNode(fullText[i]), cursor); i++; diagTimer = setTimeout(type, fullText[i-1]==='\n' ? 30 : 8); }
    else { cursor.remove(); diagTimer = null; }
  })();
}

  document.getElementById('editor').innerHTML = `
    <h2>Edit dashboard</h2>
    <p class="hint">${LOCAL ? 'You are editing a downloaded copy. Save gives you a new HTML file with your changes; use it to replace this one.' : 'Changes show on the page right away as a preview. Nothing is saved until you click Save & publish.'}</p>
    <div class="ed-row">
      <select data-act="pick" aria-label="Subject to edit" style="flex:1">${draft.subjects.map((x,i) => `<option value="${i}" ${i===editIdx?'selected':''}>${esc(x.id)}</option>`).join('')}</select>
      <button class="btn small" data-act="add-subject">+ Add subject</button>
    </div>
    ${subj}
    <h4>Model comparison</h4>
    ${(draft.models || []).map((r,i) => `<div class="ed-card">
      ${MODEL_COLS.map(c => `<label class="ed-field"><span>${c[1]}</span><input type="text" data-p="x:${i}:${c[0]}" value="${esc(r[c[0]])}"></label>`).join('')}
      <button class="btn small danger" data-act="del-model" data-i="${i}">Remove this row</button>
    </div>`).join('')}
    <button class="btn small" data-act="add-model">+ Add row</button>
    <label class="ed-field" style="margin-top:14px"><span>Note under the diagnosis</span><textarea data-p="n:diagNote">${esc(draft.diagNote)}</textarea></label>

    <h4>Research pipeline</h4>
    ${draft.pipeline.map((p,i) => `<div class="ed-pipe">
      <input type="checkbox" data-p="p:${i}:done" ${p.done?'checked':''} aria-label="${esc(p.label)} done">
      <input type="text" data-p="p:${i}:label" value="${esc(p.label)}" aria-label="Step name">
    </div>`).join('')}
    <div class="ed-actions">
      <button class="btn primary" data-act="save">${LOCAL ? 'Save & download' : 'Save & publish'}</button>
      <button class="btn" data-act="cancel">Cancel</button>
      <div class="ed-status ${cls || ''}" id="edStatus" role="status">${esc(msg || '')}</div>
    </div>`;
}
function setStatus(msg, cls) { const el = document.getElementById('edStatus'); if (el) { el.textContent = msg; el.className = 'ed-status ' + (cls || ''); } }

function onEditorInput(e) {
  const el = e.target, p = el.dataset.p;
  if (!p || !draft) return;
  const [kind, a, b] = p.split(':');
  const s = draft.subjects[editIdx];
  if (kind === 's') { s[a] = el.value; if (a === 'id') { const o = document.querySelector(`[data-act="pick"] option[value="${editIdx}"]`); if (o) o.textContent = el.value; } }
  else if (kind === 'm') {
    const v = el.value.trim() === '' ? null : Number(el.value);
    const ok = v === null || (Number.isFinite(v) && v > 0);
    el.classList.toggle('bad', !ok);
    if (ok) s.m[a][b] = v;
  }
  else if (kind === 'd') s.diag[+a][b] = el.value;
  else if (kind === 'x') draft.models[+a][b] = el.value;
  else if (kind === 'n') draft[a] = el.value;
  else if (kind === 'p') { if (b === 'done') draft.pipeline[+a].done = el.checked; else draft.pipeline[+a].label = el.value; }
  currentSubject = editIdx;
  renderAll();
}
function onEditorClick(e) {
  const btn = e.target.closest('[data-act]'); if (!btn || btn.tagName === 'SELECT') return;
  const act = btn.dataset.act, s = draft.subjects[editIdx];
  if (act !== 'del-subject') confirmDelete = false;
  if (act === 'add-subject') {
    const blank = {pred:null, gt:null};
    draft.subjects.push({ id:'S' + String(draft.subjects.length + 1).padStart(2,'0') + '-new', gender:'Male', modelGender:'male', clothing:'', photo:'', note:'', summary:'',
      m:{ shoulder:{...blank}, chest:{...blank}, waist:{...blank}, hip:{...blank} }, diag:[] });
    editIdx = draft.subjects.length - 1;
  } else if (act === 'del-subject') {
    if (!confirmDelete) { confirmDelete = true; }
    else { draft.subjects.splice(editIdx, 1); editIdx = Math.max(0, editIdx - 1); confirmDelete = false; }
  } else if (act === 'add-diag') {
    s.diag = s.diag || []; s.diag.push({ k:'waist', cat:'UNDETERMINED', conf:'medium', runsImage:'', textOnly:'', runsText:'', ds:'', runsDS:'', exp:'', fix:'' });
  } else if (act === 'add-model') {
    draft.models = draft.models || []; draft.models.push(Object.fromEntries(MODEL_COLS.map(c => [c[0], ''])));
  } else if (act === 'del-model') {
    draft.models.splice(+btn.dataset.i, 1);
  } else if (act === 'del-diag') {
    s.diag.splice(+btn.dataset.i, 1);
  } else if (act === 'cancel') { closeEditor(); return; }
  else if (act === 'save') { save(); return; }
  currentSubject = editIdx; renderEditor(); renderAll();
}
function onEditorChange(e) {
  if (e.target.dataset.act === 'pick') { editIdx = +e.target.value; confirmDelete = false; currentSubject = editIdx; renderEditor(); renderAll(); }
}
function validate(d) {
  const ids = new Set();
  for (const s of d.subjects) {
    if (!s.id.trim()) return 'Every subject needs an ID.';
    if (ids.has(s.id.trim())) return `Two subjects are both called “${s.id}”.`;
    ids.add(s.id.trim());
    for (const k of KEYS) { const x = s.m[k];
      if ((x.pred === null) !== (x.gt === null)) return `${s.id}: ${SHORT[k]} needs both a photo value and a tape value (or neither).`; }
  }
  return null;
}
async function save() {
  const problem = validate(draft);
  if (problem) { setStatus(problem, 'danger'); return; }
  draft.subjects.forEach(s => s.id = s.id.trim());
  if (LOCAL) {
    const blob = new Blob([buildPage(draft)], {type:'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'smplx_dashboard.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    DATA.subjects = clone(draft.subjects); DATA.pipeline = clone(draft.pipeline);
    closeEditor();
    return;
  }
  if (!ART) { setStatus('Saving is not available in this view.', 'danger'); return; }
  setStatus('Saving…');
  try {
    await ART.publish(buildPage(draft));
    setStatus('Saved. The page is reloading with your changes.', 'ok');
  } catch (err) {
    const c = err && err.code;
    if (c === 'conflict') setStatus('A newer version was saved somewhere else, so the page is reloading to it. Your unsaved edits were not applied.', 'danger');
    else if (['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].includes(c)) {
      setStatus('This view is read-only, so changes cannot be saved here.', 'danger');
      document.getElementById('editBtn').hidden = true; ART = null;
    }
    else if (c === 'rate_limited') setStatus('Saved too many times in a short while. Wait a minute, then click Save again.', 'danger');
    else if (c === 'too_large') setStatus('The page is too large to save.', 'danger');
    else setStatus('Could not save (' + (c || 'unknown error') + '). Please try again.', 'danger');
  }
}

// ── Start ──
document.getElementById('root').innerHTML = SHELL;
document.getElementById('subjectTabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) { currentSubject = +t.dataset.tab; renderAll(); } });
document.getElementById('threshSlider').addEventListener('input', e => { threshold = +e.target.value; document.getElementById('threshVal').textContent = threshold + '%'; renderAll(); });
document.getElementById('diagBtn').addEventListener('click', runDiagnosis);
document.getElementById('editBtn').addEventListener('click', () => document.getElementById('editor').hidden ? openEditor() : closeEditor());
const edEl = document.getElementById('editor');
edEl.addEventListener('input', onEditorInput);
edEl.addEventListener('click', onEditorClick);
edEl.addEventListener('change', onEditorChange);
renderAll();
if (typeof Chart === 'undefined') window.addEventListener('load', () => renderCharts(subjects()[currentSubject]));

(async () => {
  if (!window.claude || typeof window.claude.use !== 'function') {
    // Editing only on my own computer (opened as a file), never on the public website.
    if (location.protocol === 'file:') { LOCAL = true; document.getElementById('editBtn').hidden = false; }
    return;
  }
  const [art, user] = await Promise.all([window.claude.use('artifact'), window.claude.use('user')]);
  if (!art) return;
  const canEdit = user ? await user.canEdit() : true;
  if (!canEdit) return;
  ART = art;
  document.getElementById('editBtn').hidden = false;
})();
</script>
</body>
